name: Build & Release Persian APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag'
        required: false
        default: 'v2.10.4-fa'
        type: string

permissions:
  contents: write
  actions: read

env:
  FLUTTER_VERSION: '3.41.9'

jobs:
  build-apk:
    name: Build Persian APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build split APKs
        run: flutter build apk --release --split-per-abi

      - name: Rename APKs
        run: |
          cd build/app/outputs/flutter-apk
          mv app-arm64-v8a-release.apk     Streak-Persian-arm64-v8a.apk
          mv app-armeabi-v7a-release.apk   Streak-Persian-armeabi-v7a.apk
          mv app-x86_64-release.apk        Streak-Persian-x86_64.apk

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: streak-persian-apks
          path: build/app/outputs/flutter-apk/Streak-Persian-*.apk
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [build-apk]
    runs-on: ubuntu-latest

    steps:
      - name: Download APK artifacts
        uses: actions/download-artifact@v4
        with:
          name: streak-persian-apks
          path: release-assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || 'v2.10.4-fa' }}
          name: 'پناهگاه (Panahgah) - نسخه فارسی اندروید v2.10.4'
          body: |
            ## نسخه نهایی پناهگاه (Panahgah) نسخه v2.10.4 📱
            
            - **اصلاح کامل منوی پایین در حالت راست‌چین (RTL):** عملکرد دقیق و بدون خطای لمس و جابه‌جایی تب‌ها
            - **اصلاح جهت فلش‌ها در بخش تنظیمات:** جهت فلش‌ها به سمت چپ مطابق با اصول طراحی راست‌چین
            - **تقویم و تاریخ شمسی در تمامی بخش‌ها و فرم افزودن عادات جدید**
            - **برند اختصاصی پناهگاه با آیکون و پروفایل جدید**
            - **خروجی اختصاصی اندروید با سرعت اجرای فوق‌العاده**
            
            ### فایل‌های دانلودی:
            - **Streak-Persian-arm64-v8a.apk**: مناسب گوشی‌های جدید ۶۴ بیتی (بیش از ۹۰٪ دستگاه‌ها)
            - **Streak-Persian-armeabi-v7a.apk**: مناسب گوشی‌های قدیمی ۳۲ بیتی
            - **Streak-Persian-x86_64.apk**: مناسب شبیه‌سازها
          files: |
            release-assets/Streak-Persian-*.apk
