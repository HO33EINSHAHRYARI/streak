name: Build & Release Persian APK and Windows

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag'
        required: false
        default: 'v2.10.3-fa'
        type: string

permissions:
  contents: write
  actions: read

env:
  FLUTTER_VERSION: '3.41.9'

jobs:
  build-apk:
    name: Build Persian APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build split APKs
        run: flutter build apk --release --split-per-abi

      - name: Rename APKs
        run: |
          cd build/app/outputs/flutter-apk
          mv app-arm64-v8a-release.apk     Streak-Persian-arm64-v8a.apk
          mv app-armeabi-v7a-release.apk   Streak-Persian-armeabi-v7a.apk
          mv app-x86_64-release.apk        Streak-Persian-x86_64.apk

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: streak-persian-apks
          path: build/app/outputs/flutter-apk/Streak-Persian-*.apk
          if-no-files-found: error

  build-windows:
    name: Build Persian Windows App
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Zip the build
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath Streak-Persian-windows-x64.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: streak-persian-windows
          path: Streak-Persian-windows-x64.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [build-apk, build-windows]
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || 'v2.10.3-fa' }}
          name: 'پناهگاه (Panahgah) - ردیاب عادات و پیوستگی فردی نسخه v2.10.3'
          body: |
            ## نسخه نهایی Streak فارسی با فونت پیدا و تقویم شمسی 🚀\n\n- **ترجمه ۱۰۰٪ کامل فارسی تمامی بخش‌ها (از اینترو تا درباره ما)**\n- **فونت فارسی پیدا (Peyda)**\n- **تقویم و تاریخ شمسی (Jalali)**\n- **شروع هفته از روز شنبه به صورت پیش‌فرض**\n- **چیدمان استاندارد بدون باگ راست‌چین**
            
            - **زبان فارسی با ساختار چپ‌چین (LTR):** بدون به هم ریختگی چیدمان، نوار هفته‌ها، جسچرها و نمودارها
            - **نسخه موبایل (Android APK):** قابل نصب روی انواع گوشی‌های اندرویدی
            - **نسخه دسکتاپ ویندوز (Windows Desktop App):** فایل فشرده پرتابل؛ بدون نیاز به گوشی مستقیماً روی ویندوز اجرا کنید!
            
            ### فایل‌های دانلودی:
            - **Streak-Persian-windows-x64.zip**: نسخه پرتابل ویندوز (فقط اکسترکت کنید و Streak.exe را باز کنید!)
            - **Streak-Persian-arm64-v8a.apk**: مناسب گوشی‌های جدید اندروید
            - **Streak-Persian-armeabi-v7a.apk**: مناسب گوشی‌های قدیمی اندروید
            - **Streak-Persian-x86_64.apk**: مناسب شبیه‌سازها
          files: |
            release-assets/Streak-Persian-*.apk
            release-assets/Streak-Persian-windows-x64.zip
