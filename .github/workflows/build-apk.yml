name: Build & Release Persian APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag'
        required: false
        default: 'v2.10.6-fa'
        type: string

permissions:
  contents: write
  actions: read

env:
  FLUTTER_VERSION: '3.41.9'

jobs:
  build-apk:
    name: Build Persian APK (arm64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build arm64 APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Rename APK
        run: |
          cd build/app/outputs/flutter-apk
          mv app-release.apk Streak-Persian-arm64-v8a.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: streak-persian-apks
          path: build/app/outputs/flutter-apk/Streak-Persian-*.apk
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [build-apk]
    runs-on: ubuntu-latest

    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: streak-persian-apks
          path: release-assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || 'v2.10.6-fa' }}
          name: 'پناهگاه (Panahgah) - نسخه فارسی اندروید v2.10.6'
          body: |
            ## پناهگاه (Panahgah) نسخه v2.10.6 📱

            - **رفع کامل باگ سوییچ هفته/ماه/سال در راست‌چین:** هایلایت و لمس حالا دقیقاً روی همان گزینه‌ای می‌افتد که انتخاب می‌کنید
            - **هیت‌مپ‌های تمیزتر:** روزهای قبل از ساخت عادت و روزهای آینده دیگر خاکستری/رنگی نیستند و جدول واقعاً خالی دیده می‌شود
            - **همه نمودارها و هیت‌مپ‌ها راست‌چین شدند:** زمان از راست به چپ جریان دارد (سیر تکاملی، تکمیل ماه‌ها، ساعات تمرکز، نوارهای هفته/ماه/سال)
            - **منوی پایین کلاسیک با جلوه شیشه‌ای (Liquid Glass):** بلور قوی‌تر، درخشش لبه شیشه و سایه رنگی نرم
            - **تقویم شمسی کامل** در آمار، فوکوس، تکلیف‌ها و ویجت‌ها

            ### فایل دانلودی:
            - **Streak-Persian-arm64-v8a.apk**: مخصوص گوشی‌های ۶۴ بیتی (arm64-v8a)
          files: |
            release-assets/Streak-Persian-*.apk
