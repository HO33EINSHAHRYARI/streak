name: Build & Release Persian APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag'
        required: false
        default: 'v2.10.0-fa'
        type: string

permissions:
  contents: write
  actions: read

env:
  FLUTTER_VERSION: '3.41.9'

jobs:
  build:
    name: Build Persian APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Show versions
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Build split APKs
        run: flutter build apk --release --split-per-abi

      - name: Rename APKs
        run: |
          cd build/app/outputs/flutter-apk
          mv app-arm64-v8a-release.apk     Streak-Persian-arm64-v8a.apk
          mv app-armeabi-v7a-release.apk   Streak-Persian-armeabi-v7a.apk
          mv app-x86_64-release.apk        Streak-Persian-x86_64.apk

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: streak-persian-apks
          path: build/app/outputs/flutter-apk/Streak-Persian-*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || 'v2.10.0-fa' }}
          name: 'Streak فارسی (Habit Tracker) - نسخه v2.10.0'
          body: |
            ## نسخه فارسی اپلیکیشن Streak (ردیاب عادات و پیوستگی) 🚀
            
            - کاملاً آفلاین، بدون تبلیغات و امن
            - ترجمه به زبان فارسی (Persian Localization)
            - خروجی بیلد اتوماتیک روی گیت‌هاب (GitHub Actions CI/CD)
            
            ### فایل‌های نصبی (APK):
            - **Streak-Persian-arm64-v8a.apk**: مناسب برای اکثر گوشی‌های اندروید جدید (۶۴ بیتی)
            - **Streak-Persian-armeabi-v7a.apk**: مناسب برای گوشی‌های قدیمی‌تر (۳۲ بیتی)
            - **Streak-Persian-x86_64.apk**: مناسب برای شبیه‌سازها و پردازنده‌های اینتل
          files: |
            build/app/outputs/flutter-apk/Streak-Persian-arm64-v8a.apk
            build/app/outputs/flutter-apk/Streak-Persian-armeabi-v7a.apk
            build/app/outputs/flutter-apk/Streak-Persian-x86_64.apk
